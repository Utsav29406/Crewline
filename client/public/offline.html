<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3850">
<title>Crewline · Offline</title>
<style>
  :root { --bg: #e2e6ee; --card: #e8ebf2; --text: #262b3d; --muted: #747c94; --accent: #6366f1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f2230; --card: #262a3a; --text: #e8eaf2; --muted: #9aa1b8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 360px; text-align: center; background: var(--card); border-radius: 24px; padding: 32px 24px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Crewline needs the internet to punch in and show your attendance. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
